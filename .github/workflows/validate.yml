name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: siteprobe
      - uses: actions/checkout@v4
        with:
          repository: kujolang/kujo
          ref: 33508db47f3bc472e96d20000f7ea83e6057c30e
          path: kujo
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kujo
      - run: cargo build --release --manifest-path kujo/Cargo.toml
      - name: Validate (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/validate.sh
        working-directory: siteprobe
      - name: Validate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1
        working-directory: siteprobe
      - name: Generated artifacts are current
        shell: bash
        run: git diff --exit-code -- kujo.lock docs/generated
        working-directory: siteprobe

      - name: Verify full native concurrency sweep
        if: runner.os == 'Linux'
        working-directory: siteprobe
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo/target/release/kujo
        run: python scripts/benchmark_fixture.py --pages 10000 --concurrency-levels 1,4,8,16 --output .siteprobe/verification/native-concurrency-10000.json

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: siteprobe/.siteprobe/verification/
          include-hidden-files: true
          if-no-files-found: ignore
