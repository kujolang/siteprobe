name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile bridge/siteprobe.py tests/test_siteprobe.py
      - run: python3 tests/test_siteprobe.py
      - run: python3 -m json.tool schemas/run.schema.json >/dev/null
