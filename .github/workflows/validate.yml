name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: siteprobe
      - uses: actions/checkout@v4
        with:
          repository: kujolang/kujo
          ref: 2be1f04b89dbecd591ef1af0d68974c05586900e
          path: kujo
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kujo
      - run: cargo build --release --locked --manifest-path kujo/Cargo.toml
      - name: Validate (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/validate.sh
        working-directory: siteprobe
      - name: Validate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1
        working-directory: siteprobe
      - name: Generated artifacts are current
        shell: bash
        run: git diff --exit-code -- kujo.lock docs/generated
        working-directory: siteprobe

      - name: Verify extracted package
        shell: bash
        working-directory: siteprobe
        run: |
          ../kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }} run scripts/release.kujo -- ../kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }} qualification .siteprobe/qualification-dist
          ../kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }} run scripts/verify_release.kujo -- .siteprobe/qualification-dist ../kujo/target/release/kujo${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Verify full native concurrency sweep
        if: runner.os == 'Linux'
        working-directory: siteprobe
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo/target/release/kujo
        run: ../kujo/target/release/kujo run scripts/benchmark.kujo -- --pages 10000 --concurrency-levels 1,4,8,16 --output .siteprobe/verification/native-concurrency-10000.json

      - name: Verify dense and multilingual workloads
        if: runner.os == 'Linux'
        working-directory: siteprobe
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo/target/release/kujo
        run: |
          ../kujo/target/release/kujo run scripts/benchmark.kujo -- --pages 25 --workload dense --concurrency-levels 1,4 --output .siteprobe/verification/dense.json
          ../kujo/target/release/kujo run scripts/benchmark.kujo -- --pages 50 --workload multilingual --concurrency-levels 1,4 --output .siteprobe/verification/multilingual.json

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: siteprobe/.siteprobe/verification/
          include-hidden-files: true
          if-no-files-found: ignore
