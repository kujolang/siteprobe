name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: siteprobe
      - uses: actions/checkout@v4
        with:
          repository: kujolang/kujo
          path: kujo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kujo
      - run: cargo build --release --manifest-path kujo/Cargo.toml
      - run: bash scripts/validate.sh
        working-directory: siteprobe
