name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: siteprobe
      - uses: actions/checkout@v4
        with:
          repository: kujolang/kujo
          ref: 510cca19cb03c2dcc5589697cdbbe0158ae15c04
          path: kujo
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kujo
      - run: cargo build --release --manifest-path kujo/Cargo.toml
      - name: Validate (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/validate.sh
        working-directory: siteprobe
      - name: Validate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate.ps1
        working-directory: siteprobe
      - name: Generated artifacts are current
        shell: bash
        run: git diff --exit-code -- kujo.lock docs/generated
        working-directory: siteprobe
